version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    check-blank: false
    exclude-functions:
      - (*database/sql.Rows).Close
      - (*database/sql.DB).Close
      - (*database/sql.Tx).Rollback
      - (io.Closer).Close
  staticcheck:
    checks:
      - "all"
      - "-SA9003"  # Disable empty branch check

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - ineffassign
    - path: bench_test\.go
      linters:
        - errcheck
    - path: _test\.go
      linters:
        - unused

  max-issues-per-linter: 50
  max-same-issues: 10

run:
  timeout: 5m
  tests: true
