linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - deadcode
    - structcheck
    - varcheck

linters-settings:
  errcheck:
    # Don't check for unchecked errors in defer statements
    check-blank: false
    # Ignore these functions for errcheck
    exclude-functions:
      - (*database/sql.Rows).Close
      - (*database/sql.DB).Close
      - (*database/sql.Tx).Rollback
      - (io.Closer).Close

issues:
  # Don't fail on existing issues in test files for certain linters
  exclude-rules:
    # Ignore errcheck in test files for common patterns
    - path: _test\.go
      linters:
        - errcheck
    # Ignore errcheck in bench files
    - path: bench_test\.go
      linters:
        - errcheck
    # Ignore unused in test files
    - path: _test\.go
      linters:
        - unused

  # Maximum issues count per one linter
  max-issues-per-linter: 50
  max-same-issues: 10

run:
  timeout: 5m
  tests: true
